<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silver Strategy Manager</title>
    <script src="js/layoutMode.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="auth-panel" id="authPanel" hidden>
    <div class="panel auth-card">
        <h1>실버 전략 매니저</h1>
        <p>로그인하면 다른 컴퓨터에서도 같은 자료를 사용할 수 있습니다.</p>
        <form id="loginForm">
            <div class="form-group"><label for="loginEmail">이메일</label><input id="loginEmail" type="email" autocomplete="username" required></div>
            <div class="form-group"><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
            <button id="loginButton" class="btn-primary" type="submit">로그인</button>
            <button id="showSignupButton" class="btn-secondary" type="button">회원가입</button>
        </form>
        <form id="signupForm" hidden>
            <h2>회원가입</h2>
            <div class="form-group"><label for="signupEmail">이메일</label><input id="signupEmail" type="email" autocomplete="username" required></div>
            <div class="form-group"><label for="signupPassword">비밀번호</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" aria-describedby="signupPasswordHelp" required><small id="signupPasswordHelp" class="auth-help">8자 이상 입력해 주세요.</small></div>
            <div class="form-group"><label for="signupPasswordConfirm">비밀번호 확인</label><input id="signupPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required></div>
            <button id="signupButton" class="btn-primary" type="submit">가입하기</button>
            <button id="showLoginButton" class="btn-secondary" type="button">로그인으로 돌아가기</button>
        </form>
        <div id="migrationPanel" hidden>
            <h2>이 컴퓨터의 기존 자료</h2>
            <p id="migrationSummary"></p>
            <div class="button-row">
                <button id="importLocalButton" class="btn-primary" type="button">내 계정으로 자료 옮기기</button>
                <button id="skipImportButton" class="btn-secondary" type="button">새로 시작</button>
                <button id="downloadLocalButton" class="btn-secondary" type="button">원본 백업 받기</button>
            </div>
            <p class="auth-help">이 컴퓨터의 원본은 삭제하지 않습니다.</p>
        </div>
        <p id="authMessage" class="save-state" role="status" aria-live="polite"></p>
    </div>
</section>

<div class="layout" id="appLayout" hidden>

    <aside class="sidebar app-sidebar" id="appSidebar">

        <div class="logo">
            <span class="logo-mark">SS</span>
            <div class="logo-text">
                <h2>실버 전략</h2>
                <span>매니저</span>
            </div>
        </div>

        <button
            id="sidebarToggle"
            class="sidebar-toggle"
            type="button"
            aria-label="좌측 메뉴 접기">
            ‹
        </button>

        <nav>
            <button class="menu active" data-page="portfolio">
                <span class="menu-icon">▦</span>
                <span class="menu-label">포트폴리오</span>
            </button>

            <button class="menu" data-page="calculator">
                <span class="menu-icon">∑</span>
                <span class="menu-label">계산기</span>
            </button>

            <button class="menu" data-page="settings">
                <span class="menu-icon">⚙</span>
                <span class="menu-label">설정</span>
            </button>
        </nav>

        <div class="account-area">
            <small id="accountText"></small>
            <button id="logoutButton" class="btn-secondary" type="button" hidden>로그아웃</button>
        </div>

    </aside>

    <main class="content app-content">
        <iframe
            id="pageFrame"
            title="실버 전략 매니저 화면">
        </iframe>
    </main>

</div>

<script src="js/appConfig.js"></script>
<script src="js/backendConfig.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/serverStore.js"></script>
<script src="js/safeStorage.js"></script>
<script src="js/settingsStore.js"></script>
<script src="js/storage.js"></script>
<script src="js/historyStore.js"></script>
<script src="js/uiFeedback.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
