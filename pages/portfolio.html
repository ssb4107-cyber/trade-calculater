<!DOCTYPE html>
<html lang="ko" class="fixed-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오</title>
<script src="../js/layoutMode.js"></script>
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="page-body portfolio-body">

<div class="layout portfolio-layout">

    <aside class="sidebar portfolio-sidebar">

        <div class="header">
            <h2>포트폴리오</h2>

            <button id="addStockBtn" class="sidebar-action">
                + 종목 추가
            </button>
        </div>

        <div class="stock-filter">
            <label for="stockFilterInput">종목 필터</label>
            <input id="stockFilterInput" type="text" placeholder="보유 종목 검색">
        </div>

        <div class="stock-list" id="stockList"></div>

    </aside>

    <main class="content portfolio-content">

        <section class="portfolio-header">
            <div>
                <p class="eyebrow">선택 종목</p>
                <h1 id="stockTitle">PAAS</h1>
                <p id="stockDescription">종목을 선택해 주세요.</p>
            </div>

            <div class="price-panel">
                <div>
                    <label>현재가</label>
                    <strong id="currentPriceText">$0.00</strong>
                    <p id="averagePriceText">평단가: $0</p>
                    <p id="priceUpdatedAt">최근 갱신: 없음</p>
                    <p id="priceApiStatus" class="api-status status-wait">상태 확인 중</p>
                </div>
                <button id="updatePriceBtn" class="btn-primary visually-hidden" type="button">현재가 새로고침</button>
                <input id="currentPrice" type="number" step="0.01" class="visually-hidden" aria-hidden="true">
            </div>
        </section>

        <section id="dashboard" class="dashboard">
            <div class="dash-card">
                <div>총 투자금</div>
                <strong id="totalBuy">$0.00</strong>
            </div>

            <div class="dash-card">
                <div>총 평가금</div>
                <strong id="totalValue">$0.00</strong>
            </div>

            <div class="dash-card">
                <div>실현손익</div>
                <strong id="realizedPnL">$0.00</strong>
            </div>

            <div class="dash-card">
                <div>미실현손익</div>
                <strong id="unrealizedPnL">$0.00</strong>
            </div>

            <div class="dash-card">
                <div>총 수익률</div>
                <strong id="totalRate">0.00%</strong>
            </div>
        </section>

        <section id="positionSection">
            <div class="section-title-row">
                <h2>포지션</h2>
                <button id="addPositionBtn" class="btn-primary" type="button">+ 포지션</button>
            </div>

            <div id="positionList" class="position-list">
                아직 포지션이 없습니다.
            </div>
        </section>

    </main>

</div>

<div id="stockContextMenu" class="context-menu" hidden>
    <button id="openStockSettingsMenuBtn" type="button">종목 설정</button>
    <button id="deleteStockMenuBtn" type="button">삭제</button>
</div>

<div id="stockForm" class="modal" aria-hidden="true">
    <div class="modal-content stock-modal-content">
        <h2>종목 추가</h2>

        <div class="form-row">
            <label for="stockSearchInput">종목 검색</label>
            <div class="stock-search-row modal-search-row">
                <input id="stockSearchInput" type="text" placeholder="예: QQQ, TSLA, PAAS">
                <button id="searchStockBtn" class="btn-primary" type="button">검색</button>
            </div>
        </div>

        <div id="stockSearchResults" class="stock-search-results modal-search-results"></div>

        <details id="manualStockDetails" class="manual-stock-fields">
            <summary>직접 추가</summary>
            <div class="manual-stock-body">
                <p>검색 결과가 부족하면 직접 추가할 수 있습니다.</p>
                <input id="stockName" type="text" placeholder="표시 이름">
                <textarea id="stockMemo" rows="3" placeholder="메모"></textarea>
                <div class="button-row compact">
                    <button id="cancelStockBtn" class="btn-secondary" type="button">취소</button>
                    <button id="saveStockBtn" class="btn-primary" type="button">직접 추가</button>
                </div>
            </div>
        </details>
    </div>
</div>

<div id="stockSettingsModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <h2>종목 설정</h2>

        <div class="form-row">
            <label for="stockDisplayName">표시 이름</label>
            <input id="stockDisplayName" type="text" placeholder="예: 파나">
        </div>

        <div class="form-row">
            <label>시세 연결</label>
            <div class="quote-connection-panel">
                <strong id="quoteConnectionState">⚪ 연결되지 않음</strong>
                <span id="quoteConnectionName"></span>
                <small id="quoteConnectionExchange"></small>
            </div>
        </div>

        <div class="button-row">
            <button id="openQuoteConnectBtn" class="btn-secondary" type="button">시세 연결</button>
            <button id="cancelStockSettingsBtn" class="btn-secondary" type="button">취소</button>
            <button id="saveStockSettingsBtn" class="btn-primary" type="button">저장</button>
        </div>
    </div>
</div>

<div id="quoteConnectionModal" class="modal" aria-hidden="true">
    <div class="modal-content stock-modal-content">
        <h2>시세 연결</h2>

        <div class="form-row">
            <label for="quoteSearchInput">검색</label>
            <div class="stock-search-row modal-search-row">
                <input id="quoteSearchInput" type="text" placeholder="예: Pan">
                <button id="searchQuoteBtn" class="btn-primary" type="button">검색</button>
            </div>
        </div>

        <div id="quoteSearchResults" class="stock-search-results modal-search-results"></div>

        <div class="button-row compact">
            <button id="cancelQuoteConnectionBtn" class="btn-secondary" type="button">취소</button>
        </div>
    </div>
</div>

<div id="positionModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <h2 id="positionModalTitle">포지션 추가</h2>

        <div class="form-row">
            <label for="buyPrice">매수가</label>
            <input id="buyPrice" type="text" inputmode="decimal">
        </div>

        <div class="form-row">
            <label for="buyQty">수량</label>
            <input id="buyQty" type="text" inputmode="decimal">
        </div>

        <div class="form-row">
            <label for="buyDate">매수일</label>
            <input id="buyDate" type="date">
        </div>

        <div class="form-row">
            <label for="buyMemo">메모</label>
            <textarea id="buyMemo" rows="4"></textarea>
        </div>

        <div class="button-row">
            <button id="cancelPositionBtn" class="btn-secondary" type="button">취소</button>
            <button id="savePositionBtn" class="btn-primary" type="button">저장</button>
        </div>
    </div>
</div>

<div id="tradeModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <h2 id="tradeModalTitle">부분매도</h2>

        <div class="form-row">
            <label for="sellPrice">매도가</label>
            <input id="sellPrice" type="text" inputmode="decimal">
        </div>

        <div class="form-row">
            <label for="sellQty">매도수량</label>
            <input id="sellQty" type="text" inputmode="decimal">
        </div>

        <div class="button-row">
            <button id="cancelTradeBtn" class="btn-secondary" type="button">취소</button>
            <button id="saveTradeBtn" class="btn-primary" type="button">저장</button>
        </div>
    </div>
</div>

<script src="../js/appConfig.js"></script>
<script src="../js/safeStorage.js"></script>
<script src="../js/settingsStore.js"></script>
<script src="../js/uiFeedback.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/priceProvider.js"></script>
<script src="../js/refreshManager.js"></script>
<script src="../js/positionService.js"></script>
<script src="../js/portfolio.js"></script>
</body>
</html>
