<!DOCTYPE html>
<html lang="ko" class="scroll-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
    <script src="../js/layoutMode.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="page-body calculator-body">
<main class="calculator-page">
    <div class="calculator-shell">

        <header class="calculator-header">
            <div>
                <h1>주식 매매 계산기</h1>
                <p>기준 가격에서 1% 단위의 매수/매도 가격을 계산합니다.</p>
            </div>
        </header>

        <section class="calculator-card">
            <h2>통화 설정</h2>

            <div class="segmented-control" role="group" aria-label="통화 선택">
                <button id="btnUSD" class="active" type="button" data-currency="USD">
                    달러 ($)
                </button>
                <button id="btnKRW" type="button" data-currency="KRW">
                    원화 (₩)
                </button>
            </div>

            <label class="option-line" for="autoDecimal">
                <input id="autoDecimal" type="checkbox" checked>
                달러 입력 시 마지막 두 자리를 자동 소수로 처리
            </label>
        </section>

        <section class="calculator-card">
            <h2>현재가로 기준 가격 환산</h2>

            <div class="calculator-grid">
                <div class="calculator-field">
                    <label for="currentPrice">현재가</label>
                    <div class="money-input-wrap">
                        <span class="currency-prefix" data-currency-symbol>$</span>
                        <input id="currentPrice" type="text" inputmode="decimal" placeholder="25.50">
                    </div>
                </div>

                <div class="calculator-field">
                    <label for="changePercent">등락률</label>
                    <div class="sign-control">
                        <button id="changeSignBtn" type="button" data-sign="-1">-</button>
                        <div class="percent-input-wrap">
                            <input id="changePercent" type="text" inputmode="decimal" placeholder="예: 3.25">
                        </div>
                    </div>
                </div>
            </div>

            <p class="helper-text">
                예: 현재가가 25.50달러이고 -3%라면, 하락 전 기준 가격을 계산합니다.
            </p>

            <div class="calculator-actions">
                <button id="convertPriceBtn" class="btn-primary" type="button">기준 가격으로 환산</button>
            </div>
        </section>

        <section class="calculator-card">
            <h2>분할 매매 가격</h2>

            <div class="calculator-field">
                <label for="basePrice">기준 가격</label>
                <div class="money-input-wrap">
                    <span class="currency-prefix" data-currency-symbol>$</span>
                    <input id="basePrice" type="text" inputmode="decimal" placeholder="25.50">
                </div>
            </div>

            <p class="helper-text">
                기준 가격을 입력하면 1%부터 10%까지의 매수/매도 가격이 자동 계산됩니다.
            </p>
        </section>

        <section id="targetSection" class="calculator-card" hidden>
            <h2>1% 단위 가격표</h2>

            <table class="target-table">
                <thead>
                    <tr>
                        <th>간격</th>
                        <th>매수 가격</th>
                        <th>매도 가격</th>
                        <th>기록</th>
                    </tr>
                </thead>
                <tbody id="targetTableBody"></tbody>
            </table>
        </section>

        <section class="calculator-card">
            <div class="section-title-row">
                <h2>최근 기록</h2>
                <button id="clearHistoryBtn" class="danger-link" type="button">전체 삭제</button>
            </div>

            <table class="history-table">
                <thead>
                    <tr>
                        <th>시간</th>
                        <th>기준가</th>
                        <th>%</th>
                        <th>매수</th>
                        <th>매도</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </section>

    </div>
</main>

    <script src="../js/settingsStore.js"></script>
    <script src="../js/uiFeedback.js"></script>
    <script src="../js/calculator.js"></script>
</body>
</html>
